<style>

  .wrong { animation: shake .45s linear; }
  /* 사진에서 오려 낸 번호키 버튼·손잡이 */
  .kbtn { cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; transition: transform .06s, filter .06s, box-shadow .06s; }

  @keyframes unfold { 0% { transform: perspective(900px) rotateX(80deg) scale(.82); opacity: 0; filter: brightness(.35); } 55% { opacity: 1; } 100% { transform: none; filter: none; } }
  /* 장소 들어갈 때·시각 바뀔 때 */
  #view .viewport { animation: viewIn .5s ease both; }
  @keyframes viewIn { from { opacity: 0; filter: brightness(.2); } }

  /* 죽는 장면 */

  .scare img.a { animation: scareZoom .55s cubic-bezier(.1, .9, .2, 1) .12s forwards; filter: contrast(1.55) brightness(.9) saturate(.35); }
  .scare img.b { mix-blend-mode: screen; animation: scareGhost .55s steps(3) .12s forwards; filter: contrast(1.6) sepia(1) hue-rotate(-50deg) saturate(5) brightness(.75); }
  .scare .flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: difference; animation: flash .4s steps(1) .12s; }
  .scare.out { transition: opacity .45s; opacity: 0; }

  @keyframes scareHit { 0% { opacity: 1; transform: scale(1.5); } 10% { transform: scale(1.14) translate(-1%, 1%); } 100% { opacity: 1; transform: scale(1.03); } }

  /* 컷신 */
